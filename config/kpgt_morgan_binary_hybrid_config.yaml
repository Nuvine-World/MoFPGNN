model_type: kpgt_morgan_pretrained_hybrid
fp_variant: binary               # appended to results folder name
dataset: AGILE
split: random                    # 'random'
device: cuda

# Paths
csv_path: data/AGILE.csv
split_path: data/splits/AGILE/random.npy
embeddings_path: data/fingerprints/AGILE/kpgt_embeddings.pkl
morgan_path: data/fingerprints/AGILE/morgan_binary.pkl

# Training hyperparameters
epochs: 100
lr: 0.001
batch_size: 64
weight_decay: 0.0001
patience: 30
warmup_epochs: 5
grad_clip: 1.0
loss_fn: huber
loss_per_epoch: true

# MLP Regression Head (input = 2304 + 2048 = 4352)
mlp_head:
  hidden_layers: [512, 256]
  dropout: 0.3
