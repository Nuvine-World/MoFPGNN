# ---- Dataset ----
dataset: AGILE
data_path: data/AGILE.csv
split_type: random          # random | Murcko_scaffold | scaffold_balanced
split_sizes: [0.72, 0.18, 0.10]

# ---- Chemprop (D-MPNN) branch ----
chemprop:
  hidden_size: 300          # bond message / atom embedding dimension
  depth: 3                  # number of message-passing rounds
  dropout: 0.0
  ffn_depth: 2              # depth of per-branch FFN after pooling
  output_dim: 300           # embedding dim passed to concat layer

# ---- Morgan fingerprint branch ----
morgan:
  radius: 2
  n_bits: 2048
  use_counts: true
  use_chirality: true
  # Precomputed file (generated by chemff/morgan/featurizer.py CLI):
  fp_path: data/fingerprints/AGILE/morgan.pkl

# ---- Combined feedforward head ----
# Input dim = chemprop.output_dim + morgan.n_bits = 300 + 2048 = 2348
ffn:
  hidden_layers: [1024, 512, 256]   # widths of hidden layers
  dropout: 0.1
  output_dim: 1                     # regression → single value

# ---- Training ----
device: cpu                         # cpu | cuda | mps
epochs: 100
lr: 0.0002
batch_size: 100
loss: mse                           # mse | mae
optimizer: adam

# ---- Output ----
checkpoint_dir: checkpoints/chemff
save_format: csv
